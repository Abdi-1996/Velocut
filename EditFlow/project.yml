name: EditFlow
options:
  bundleIdPrefix: kz.colorize
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.6.8
    CURRENT_PROJECT_VERSION: 17
    SWIFT_VERSION: 5.10
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  EditFlow:
    type: application
    platform: iOS
    sources:
      - path: EditFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.colorize.editflow
        PRODUCT_NAME: EditFlow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EditFlow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photo-video
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: EditFlow uses your library to import clips, photos, and video audio into projects.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: EditFlow saves finished edits to your photo library.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - EditFlowTests
  EditFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EditFlowTests
    dependencies:
      - target: EditFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.colorize.editflow.tests
        GENERATE_INFOPLIST_FILE: YES
