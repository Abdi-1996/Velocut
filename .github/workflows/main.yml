name: Build VeloCut AI IPA
run-name: VeloCut v0.5.6 debug • ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['VeloCutAI/**','.github/workflows/main.yml']
permissions:
  contents: read
concurrency:
  group: velocut-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare v0.4.2 patcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('VeloCutAI/patch_v04_interactions.py');s=p.read_text();s=s.replace(r"ForEach\(0<\.\.<3",r"ForEach\(0\.\.<3");p.write_text(s)
          PY
      - run: python3 VeloCutAI/patch_v04_interactions.py
      - run: python3 VeloCutAI/patch_v043_finish.py
      - run: python3 VeloCutAI/patch_v044_curve_ui.py
      - run: python3 VeloCutAI/patch_v044_compile.py
      - run: python3 VeloCutAI/patch_v045_matcher_fix.py
      - run: python3 VeloCutAI/patch_v045_card_matcher.py
      - run: python3 VeloCutAI/patch_v045_pro_ui.py
      - run: python3 VeloCutAI/patch_v045_compile.py
      - run: python3 VeloCutAI/patch_v046_curve_stability.py
      - run: python3 VeloCutAI/patch_v047_matcher_fix.py
      - run: python3 VeloCutAI/patch_v047_clean_ui.py
      - run: python3 VeloCutAI/patch_v047_compile.py
      - run: python3 VeloCutAI/patch_v048_rife_ai.py
      - run: python3 VeloCutAI/patch_v049_audio_beats.py
      - name: Restore exact v0.5 foundation
        run: python3 VeloCutAI/patch_v050_pro_workspace.py
      - name: Relax v0.5 track matcher
        run: python3 VeloCutAI/patch_v054_relax_v053_matcher.py
      - name: Upgrade only v0.5 tracks
        run: python3 VeloCutAI/patch_v053_universal_tracks.py
      - name: Fix track controls and audio gallery
        run: python3 VeloCutAI/patch_v055_track_controls_audio_gallery.py
      - name: Dynamic tracks and contextual audio editor
        run: python3 VeloCutAI/patch_v056_dynamic_tracks_audio_ui.py
      - name: Inspect final timeline gesture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('VeloCutAI/VeloCutAI/VeloCutV4.swift').read_text()
          for needle in ['private var timeline:some View','@ViewBuilder private func timelineCanvas','timelineDragStart','DragGesture','MagnificationGesture','simultaneousGesture']:
              print('\n===== '+needle+' =====')
              pos=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  print(s[max(0,i-600):min(len(s),i+1600)])
                  pos=i+len(needle)
          raise SystemExit(17)
          PY
