name: Build VeloCut AI v0.4.8 IPA
run-name: VeloCut v0.4.8 • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/main.yml'

permissions:
  contents: read

concurrency:
  group: velocut-v048-build
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned VeloCut IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get VeloCut v0.4.8 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf VeloCutSource
          git -c http.https://github.com/.extraheader= clone \
            --depth 1 \
            --branch velocut-build \
            https://github.com/Abdi-1996/edit.git \
            VeloCutSource
          test -f VeloCutSource/VeloCutAI/project.yml
          test -f VeloCutSource/VeloCutAI/VeloCutAI/VeloCutV48AI.swift

      - name: Prepare v0.4.2 patcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('VeloCutSource/VeloCutAI/patch_v04_interactions.py')
          s = p.read_text()
          s = s.replace(r"ForEach\(0<\.\.<3", r"ForEach\(0\.\.<3")
          p.write_text(s)
          PY

      - name: Apply VeloCut patch chain
        shell: bash
        run: |
          set -euo pipefail
          python3 VeloCutSource/VeloCutAI/patch_v04_interactions.py
          python3 VeloCutSource/VeloCutAI/patch_v043_finish.py
          python3 VeloCutSource/VeloCutAI/patch_v044_curve_ui.py
          python3 VeloCutSource/VeloCutAI/patch_v044_compile.py
          python3 VeloCutSource/VeloCutAI/patch_v045_matcher_fix.py
          python3 VeloCutSource/VeloCutAI/patch_v045_card_matcher.py
          python3 VeloCutSource/VeloCutAI/patch_v045_pro_ui.py
          python3 VeloCutSource/VeloCutAI/patch_v045_compile.py
          python3 VeloCutSource/VeloCutAI/patch_v046_curve_stability.py
          python3 VeloCutSource/VeloCutAI/patch_v047_matcher_fix.py
          python3 VeloCutSource/VeloCutAI/patch_v047_clean_ui.py
          python3 VeloCutSource/VeloCutAI/patch_v047_compile.py
          python3 VeloCutSource/VeloCutAI/patch_v048_rife_ai.py

      - name: Select Xcode 16.4
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: VeloCutSource/VeloCutAI
        run: |
          set -euo pipefail
          xcodegen generate
          test -d VeloCutAI.xcodeproj
          xcodebuild -list -project VeloCutAI.xcodeproj

      - name: Build unsigned iOS app
        working-directory: VeloCutSource/VeloCutAI
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project VeloCutAI.xcodeproj \
            -scheme VeloCutAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VeloCutDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS_DIR="$RUNNER_TEMP/VeloCutDerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name 'VeloCutAI.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::VeloCutAI.app was not found"
            exit 1
          fi
          PAYLOAD_DIR="$RUNNER_TEMP/VeloCutPayload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR/Payload"
          ditto "$APP_PATH" "$PAYLOAD_DIR/Payload/VeloCutAI.app"
          cd "$PAYLOAD_DIR"
          zip -qry "$GITHUB_WORKSPACE/VeloCutAI-v0.4.8-clean-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/VeloCutAI-v0.4.8-clean-unsigned.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeloCutAI-v0.4.8-clean-unsigned-ipa
          path: VeloCutAI-v0.4.8-clean-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeloCutAI-v0.4.8-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
