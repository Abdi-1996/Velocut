name: EditFlow iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main, editflow]
    paths:
      - "EditFlow/**"
      - ".github/workflows/build-editflow.yml"

concurrency:
  group: editflow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Generate project
        run: |
          brew install xcodegen
          cd EditFlow
          xcodegen generate
      - name: Build for simulator
        run: |
          cd EditFlow
          xcodebuild \
            -project EditFlow.xcodeproj \
            -scheme EditFlow \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Detect available simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((d["udid"] for devices in data["devices"].values() for d in devices if d.get("isAvailable") and "iPhone" in d.get("name", "")), ""))')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        if: steps.simulator.outputs.device_id != ''
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          cd EditFlow
          xcodebuild \
            -project EditFlow.xcodeproj \
            -scheme EditFlow \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Generate project
        run: |
          brew install xcodegen
          cd EditFlow
          xcodegen generate
      - name: Build unsigned device app
        run: |
          cd EditFlow
          xcodebuild \
            -project EditFlow.xcodeproj \
            -scheme EditFlow \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry EditFlow-1.3.1-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: EditFlow-1.3.1-unsigned-IPA
          path: ${{ runner.temp }}/EditFlow-1.3.1-unsigned.ipa
          if-no-files-found: error
