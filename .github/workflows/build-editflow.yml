name: EditFlow iOS Build

on:
  workflow_dispatch:
  push:
    branches: [editflow]
    paths:
      - ".github/scripts/finalize_editflow_1_7_0.py"
      - ".github/workflows/build-editflow.yml"

permissions:
  contents: write

jobs:
  finalize-1-7-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editflow
      - name: Finalize EditFlow 1.7.0 patch
        run: python3 .github/scripts/finalize_editflow_1_7_0.py
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EditFlow .github/workflows/build-editflow.yml
          git commit -m "Finalize timeline pinch interaction"
          git push origin editflow
