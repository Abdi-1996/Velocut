name: EditFlow iOS Build

on:
  workflow_dispatch:
  push:
    branches: [editflow]
    paths:
      - ".github/scripts/apply_editflow_1_8_0.py"
      - ".github/workflows/build-editflow.yml"

permissions:
  contents: write

jobs:
  apply-1-8-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editflow
      - name: Apply EditFlow 1.8.0 patch
        run: python3 .github/scripts/apply_editflow_1_8_0.py
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EditFlow
          git commit -m "Add contextual bottom toolbar"
          git push origin editflow
