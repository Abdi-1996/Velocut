name: EditFlow iOS Build

on:
  workflow_dispatch:
  push:
    branches: [editflow]
    paths:
      - ".github/scripts/fix_editflow_1_8_1_bottom_panel.py"
      - ".github/workflows/build-editflow.yml"

permissions:
  contents: write

jobs:
  apply-1-8-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editflow
      - name: Apply EditFlow 1.8.1 patch
        run: python3 .github/scripts/fix_editflow_1_8_1_bottom_panel.py
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EditFlow
          git commit -m "Keep timeline visible with one contextual bottom panel"
          git push origin editflow
