name: EditFlow iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main, editflow]
    paths:
      - "EditFlow/**"
      - ".github/workflows/build-editflow.yml"
      - ".github/scripts/apply_editflow_1_6_8.py"

concurrency:
  group: editflow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-1-6-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply unified trim fix
        run: python3 .github/scripts/apply_editflow_1_6_8.py
      - name: Commit patch if changed
        run: |
          if git diff --quiet -- EditFlow/EditFlow/Views/Editor/TimelineView.swift EditFlow/project.yml EditFlow/CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EditFlow/EditFlow/Views/Editor/TimelineView.swift EditFlow/project.yml EditFlow/CHANGELOG.md
          git commit -m "Fix trim edge selection and live thumbnails"
          git push
